
<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 14px;
      font-family: Arial, sans-serif;
      color: #18243a;
      background: #f1f5fb;
    }

    .card {
      max-width: 480px;
      margin: 20px auto;
      padding: 28px;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 10px 35px #14284b12;
    }

    .tag {
      display: inline-block;
      padding: 7px 11px;
      border-radius: 20px;
      color: #2459c4;
      background: #e8efff;
      font-size: 12px;
      font-weight: bold;
    }

    h2 { margin: 20px 0 8px; }

    .subtitle {
      color: #64748b;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 17px 0 8px;
      font-size: 14px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d6deeb;
      border-radius: 9px;
      font-size: 15px;
      outline: none;
    }

    input:focus { border-color: #3568d4; }

    input[readonly] {
      background: #f5f7fb;
      color: #334155;
    }

    .hint {
      margin-top: 7px;
      font-size: 12px;
      color: #64748b;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #2459c4;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #message {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 9px;
      font-size: 14px;
      line-height: 1.5;
    }

    .success {
      display: block !important;
      color: #176638;
      background: #e7f8ed;
    }

    .error {
      display: block !important;
      color: #a12626;
      background: #fff0f0;
    }

    .notice {
      display: block !important;
      color: #7a5200;
      background: #fff7df;
    }

    footer {
      margin-top: 25px;
      text-align: center;
      font-size: 12px;
      color: #8490a3;
    }
  </style>
</head>

<body>
  <main class="card">
    <span class="tag">B.TECH BIOTECHNOLOGY</span>

    <h2>Anti-Ragging Number</h2>

    <p class="subtitle">
      Enter your enrollment number to verify your details,
      then submit your actual Anti-Ragging reference number.
      Only one submission is allowed per student.
    </p>

    <form id="form">
      <label for="enrollment">Enrollment Number</label>
      <input id="enrollment" required maxlength="50"
        autocomplete="off" placeholder="e.g. A20204126003">

      <p class="hint">Your registered student details will appear automatically.</p>

      <label for="name">Student Name</label>
      <input id="name" readonly placeholder="Auto-filled">

      <label for="institute">Institute</label>
      <input id="institute" readonly placeholder="Auto-filled">

      <label for="program">Program</label>
      <input id="program" readonly placeholder="Auto-filled">

      <label for="reference">Anti-Ragging Number</label>
      <input id="reference" required maxlength="150"
        placeholder="Enter your reference number">

      <button id="submitBtn" type="submit" disabled>
        Verify enrollment first
      </button>
    </form>

    <div id="message" role="status" aria-live="polite"></div>

    <footer>Check your details before submitting.</footer>
  </main>

  <script>
    const $ = id => document.getElementById(id);

    let verifiedEnrollment = '';
    let requestVersion = 0;
    let lookupTimer;
    let alreadySubmitted = false;

    function showMessage(text, type) {
      $('message').textContent = text;
      $('message').className = type;
    }

    function updateButton() {
      const current = $('enrollment').value.trim().toUpperCase();
      const verified = verifiedEnrollment !== '' &&
        verifiedEnrollment === current;

      if (verified && alreadySubmitted) {
        $('submitBtn').disabled = true;
        $('submitBtn').textContent = 'Already Submitted';
      } else if (verified) {
        $('submitBtn').disabled = false;
        $('submitBtn').textContent = 'Submit Reference Number';
      } else {
        $('submitBtn').disabled = true;
        $('submitBtn').textContent = 'Verify enrollment first';
      }
    }

    function clearStudent() {
      verifiedEnrollment = '';
      alreadySubmitted = false;

      $('name').value = '';
      $('institute').value = '';
      $('program').value = '';
      $('reference').value = '';
      $('reference').readOnly = false;

      updateButton();
    }

    $('enrollment').addEventListener('input', function () {
      clearTimeout(lookupTimer);

      const enrollment = this.value.trim().toUpperCase();
      const version = ++requestVersion;

      clearStudent();
      $('message').className = '';

      if (!enrollment) return;

      lookupTimer = setTimeout(function () {
        google.script.run
          .withSuccessHandler(function (result) {
            if (version !== requestVersion) return;

            if (!result.success) {
              showMessage(result.message, 'error');
              return;
            }

            $('name').value = result.name || '';
            $('institute').value = result.institute || '';
            $('program').value = result.program || '';
            $('reference').value = result.referenceNo || '';

            verifiedEnrollment = enrollment;
            alreadySubmitted = Boolean(result.alreadySubmitted);

            if (alreadySubmitted) {
              $('reference').readOnly = true;
              showMessage(
                'This student has already submitted. Another submission is not allowed. Contact your class representative for corrections.',
                'notice'
              );
            }

            updateButton();
          })
          .withFailureHandler(function () {
            if (version === requestVersion) {
              showMessage('Unable to verify enrollment. Please retry.', 'error');
            }
          })
          .lookupStudent(enrollment);
      }, 300);
    });

    $('form').addEventListener('submit', function (event) {
      event.preventDefault();

      const enrollment = $('enrollment').value.trim().toUpperCase();
      const reference = $('reference').value.trim();

      if (
        !verifiedEnrollment ||
        verifiedEnrollment !== enrollment ||
        !$('name').value
      ) {
        showMessage('Enter a valid enrollment number and wait for verification.', 'error');
        return;
      }

      if (alreadySubmitted) {
        showMessage('You have already submitted. Another submission is blocked.', 'notice');
        return;
      }

      if (!reference) {
        showMessage('Enter your Anti-Ragging Number.', 'error');
        return;
      }

      $('submitBtn').disabled = true;
      $('submitBtn').textContent = 'Submitting...';

      google.script.run
        .withSuccessHandler(function (result) {
          alreadySubmitted = true;
          $('reference').readOnly = true;
          updateButton();
          showMessage(result.message, 'success');
        })
        .withFailureHandler(function (error) {
          updateButton();
          showMessage(
            error.message || 'Submission failed. Please retry.',
            'error'
          );
        })
        .submitReference({ enrollment: enrollment, reference: reference });
    });
  </script>
</body>
</html>
